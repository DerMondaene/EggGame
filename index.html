<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCD Game & Watch - Wolf & Eggs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Metallic LCD Handheld Chassis */
        .handheld-chassis {
            background: linear-gradient(135deg, #c5a059 0%, #edd395 30%, #a27a36 70%, #634819 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.6), inset 0 -4px 10px rgba(0,0,0,0.6);
            border: 4px solid #3d2a0f;
        }

        .chassis-inner {
            background: #e2e8f0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 0);
            background-size: 8px 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        /* LCD Screen Ambient & Grid */
        .lcd-viewport {
            background-color: #9ea78c;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.04) 50%, rgba(0, 0, 0, 0.1) 50%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.03));
            background-size: 100% 4px, 4px 100%;
            border: 6px solid #1e293b;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        /* LCD Digital Numbers */
        .lcd-number {
            font-family: 'Press Start 2P', monospace;
            color: #1a2e1a;
            text-shadow: 0 0 2px rgba(26, 46, 26, 0.2);
        }

        /* Segment Styles */
        .lcd-seg {
            opacity: 0.06; /* Ghost segment background */
            transition: opacity 0.03s ease;
        }

        .lcd-seg.active {
            opacity: 0.92;
            filter: drop-shadow(0px 0px 1px rgba(0,20,0,0.6));
        }

        .lcd-seg.miss-active {
            opacity: 0.95;
            color: #3b0707;
        }

        /* Red Push Buttons */
        .red-btn {
            background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
            box-shadow: 0 6px 0 #7f1d1d, 0 10px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.05s ease;
        }

        .red-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7f1d1d, 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .small-btn {
            background: linear-gradient(to bottom, #64748b, #334155);
            box-shadow: 0 3px 0 #1e293b, 0 4px 6px rgba(0,0,0,0.4);
        }
        .small-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e293b;
        }
    </style>
</head>

    <script>
        // ================= WEB AUDIO SYNTHESIZER =================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const t = audioCtx.currentTime;

                if (type === 'tick') { // Standard step sound
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, t);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
                    osc.start(t);
                    osc.stop(t + 0.03);
                } else if (type === 'move') { // Catcher movement
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, t);
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    osc.start(t);
                    osc.stop(t + 0.04);
                } else if (type === 'catch') { // Successful egg catch
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, t);
                    osc.frequency.setValueAtTime(1600, t + 0.04);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
                    osc.start(t);
                    osc.stop(t + 0.09);
                } else if (type === 'miss') { // Egg drop / splash
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.linearRampToValueAtTime(100, t + 0.25);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                    osc.start(t);
                    osc.stop(t + 0.25);
                } else if (type === 'gameover') { // Game over sequence
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, t);
                    osc.frequency.setValueAtTime(300, t + 0.15);
                    osc.frequency.setValueAtTime(200, t + 0.3);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                    osc.start(t);
                    osc.stop(t + 0.5);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        // ================= GAME LOGIC & STATE =================
        // Positions: 'UL' (Upper Left), 'DL' (Down Left), 'UR' (Upper Right), 'DR' (Down Right)
        const POSITIONS = ['UL', 'DL', 'UR', 'DR'];

        let gameState = 'IDLE'; // IDLE, PLAYING, GAMEOVER
        let gameMode = 'A'; // 'A' (Standard) or 'B' (Faster & More Intense)
        let score = 0;
        let hiScore = parseInt(localStorage.getItem('lcd_wolf_hiscore')) || 0;
        let misses = 0;
        let catcherPos = 'UL'; // Default position

        // Active eggs on tracks: Array of objects { id, lane: 'UL'|'DL'|'UR'|'DR', step: 0..3 }
        let activeEggs = [];
        let nextEggId = 1;

        // Timing & Speed Variables
        let tickInterval = 800; // Ms per tick step
        let tickTimer = null;
        let ticksCount = 0;

        // UI Element References
        const scoreText = document.getElementById('scoreText');
        const hiScoreText = document.getElementById('hiScoreText');
        const gameModeLabel = document.getElementById('gameModeLabel');
        const lcdOverlay = document.getElementById('lcdOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMessage = document.getElementById('overlayMessage');

        hiScoreText.textContent = String(hiScore).padStart(4, '0');

        // ================= RENDER FUNCTIONS =================
        function updateDisplay() {
            // 1. Clear all egg segments
            POSITIONS.forEach(pos => {
                for (let i = 0; i < 4; i++) {
                    const seg = document.getElementById(`seg-egg-${pos}${i}`);
                    if (seg) seg.classList.remove('active');
                }
            });

            // 2. Clear ground miss splashes
            document.getElementById('seg-miss-L').classList.remove('active');
            document.getElementById('seg-miss-R').classList.remove('active');

            // 3. Render Active Eggs
            activeEggs.forEach(egg => {
                const segId = `seg-egg-${egg.lane}${egg.step}`;
                const seg = document.getElementById(segId);
                if (seg) seg.classList.add('active');
            });

            // 4. Render Catcher Position
            POSITIONS.forEach(pos => {
                const seg = document.getElementById(`seg-catcher-${pos}`);
                if (seg) {
                    if (pos === catcherPos) seg.classList.add('active');
                    else seg.classList.remove('active');
                }
            });

            // 5. Render Miss Indicators (Broken Chicks at top)
            for (let m = 1; m <= 3; m++) {
                const missElem = document.getElementById(`miss${m}`);
                if (m <= misses) {
                    missElem.classList.add('active', 'miss-active');
                } else {
                    missElem.classList.remove('active', 'miss-active');
                }
            }

            // 6. Update Score Display
            scoreText.textContent = String(score).padStart(4, '0');
        }

        function setCatcherPos(pos) {
            if (gameState !== 'PLAYING') return;
            if (catcherPos !== pos) {
                catcherPos = pos;
                playBeep('move');
                updateDisplay();
            }
        }

        // ================= GAME TICK ENGINE =================
        function gameTick() {
            if (gameState !== 'PLAYING') return;

            ticksCount++;
            playBeep('tick');

            let newEggList = [];
            let missedThisTick = false;

            // Advance existing eggs
            for (let i = 0; i < activeEggs.length; i++) {
                let egg = activeEggs[i];
                
                if (egg.step < 3) {
                    // Move egg down ramp
                    egg.step++;
                    newEggList.push(egg);
                } else if (egg.step === 3) {
                    // Reached edge of ramp (Catch Zone!)
                    if (catcherPos === egg.lane) {
                        // Caught!
                        score++;
                        playBeep('catch');
                        if (score > hiScore) {
                            hiScore = score;
                            localStorage.setItem('lcd_wolf_hiscore', hiScore);
                            hiScoreText.textContent = String(hiScore).padStart(4, '0');
                        }
                    } else {
                        // Missed! Drops to ground
                        misses++;
                        missedThisTick = true;
                        playBeep('miss');

                        // Show splash on ground corresponding to side
                        const splashSeg = (egg.lane === 'UL' || egg.lane === 'DL') ? 'seg-miss-L' : 'seg-miss-R';
                        document.getElementById(splashSeg).classList.add('active');
                    }
                }
            }

            activeEggs = newEggList;

            // Check Game Over Condition
            if (misses >= 3) {
                endGame();
                return;
            }

            // Spawn new egg periodically based on speed & mode
            const spawnRate = gameMode === 'A' ? 3 : 2; // Spawn every N ticks
            if (ticksCount % spawnRate === 0 || activeEggs.length === 0) {
                // Pick random lane
                const randomLane = POSITIONS[Math.floor(Math.random() * POSITIONS.length)];
                activeEggs.push({
                    id: nextEggId++,
                    lane: randomLane,
                    step: 0
                });
            }

            // Dynamic Speed Escalation
            // Every 10 points speeds up tick interval slightly
            const speedLevel = Math.min(Math.floor(score / 10), 12);
            tickInterval = Math.max(250, (gameMode === 'A' ? 700 : 500) - (speedLevel * 35));

            updateDisplay();

            // Schedule next tick
            if (gameState === 'PLAYING') {
                tickTimer = setTimeout(gameTick, tickInterval);
            }
        }

        // ================= GAME LIFECYCLE =================
        function startGame(mode = 'A') {
            initAudio();
            gameMode = mode;
            gameModeLabel.textContent = `GAME ${mode}`;
            gameState = 'PLAYING';
            score = 0;
            misses = 0;
            ticksCount = 0;
            activeEggs = [];
            catcherPos = 'UL';
            tickInterval = gameMode === 'A' ? 750 : 550;

            lcdOverlay.classList.add('hidden');
            updateDisplay();

            if (tickTimer) clearTimeout(tickTimer);
            tickTimer = setTimeout(gameTick, tickInterval);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            if (tickTimer) clearTimeout(tickTimer);
            playBeep('gameover');

            overlayTitle.textContent = "GAME OVER";
            overlayMessage.textContent = `Punkte: ${score} | Highscore: ${hiScore}`;
            document.getElementById('startBtn').textContent = "ERNEUT SPIELEN";
            lcdOverlay.classList.remove('hidden');
            updateDisplay();
        }

        // ================= EVENT LISTENERS & CONTROLS =================
        // On-Screen Handheld Buttons
        document.getElementById('btnUL').addEventListener('click', () => { initAudio(); setCatcherPos('UL'); });
        document.getElementById('btnDL').addEventListener('click', () => { initAudio(); setCatcherPos('DL'); });
        document.getElementById('btnUR').addEventListener('click', () => { initAudio(); setCatcherPos('UR'); });
        document.getElementById('btnDR').addEventListener('click', () => { initAudio(); setCatcherPos('DR'); });

        document.getElementById('startBtn').addEventListener('click', () => startGame(gameMode));
        document.getElementById('btnGameA').addEventListener('click', () => startGame('A'));
        document.getElementById('btnGameB').addEventListener('click', () => startGame('B'));

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;

            const key = e.key.toLowerCase();
            if (key === 'q' || key === 'w' || key === 'arrowup') {
                setCatcherPos('UL');
            } else if (key === 'a' || key === 's' || key === 'arrowleft') {
                setCatcherPos('DL');
            } else if (key === 'e' || key === 'i' || key === 'arrowright') {
                setCatcherPos('UR');
            } else if (key === 'd' || key === 'k' || key === 'arrowdown') {
                setCatcherPos('DR');
            }
        });

        // Initialize display ghost state on load
        updateDisplay();
    </script>
</body>
</html>
